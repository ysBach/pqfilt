name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/artifacts.yml
    with:
      release: ${{ inputs.release || false }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.13
      - name: Lint
        run: uv run --no-sync ruff check . .github/scripts .github/tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --extra docs --python 3.12
      - name: Build docs
        run: uv run --no-sync sphinx-build -W docs docs/_build/html
