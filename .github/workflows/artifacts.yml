name: Build and test distributions

on:
  workflow_call:
    inputs:
      release:
        description: Require release notes and validate tags
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev --python 3.13
      - name: Check release metadata
        id: version
        env:
          CHECK_RELEASE: ${{ inputs.release }}
        shell: bash
        run: |
          args=()
          if [ "$CHECK_RELEASE" = "true" ]; then
            args+=(--release)
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              args+=(--tag "$GITHUB_REF_NAME")
            fi
          fi
          uv run --no-sync python .github/scripts/check_release.py "${args[@]}"
      - name: Test release validation
        run: uv run --no-sync pytest .github/tests -q
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        distribution: [wheel]
        include:
          - python-version: "3.13"
            distribution: sdist
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install distribution in a fresh environment
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        shell: bash
        run: |
          uv venv --python "$PYTHON_VERSION" .artifact-venv
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          artifact="${wheels[0]}"
          if [ "$DISTRIBUTION" = "sdist" ]; then
            artifact="${sdists[0]}"
          fi
          uv pip install --python .artifact-venv/bin/python "$artifact" 'pytest>=7'
      - name: Verify installed package and run tests
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          .artifact-venv/bin/python - <<'PY'
          import os
          import sysconfig
          from importlib.metadata import version
          from pathlib import Path

          import pqfilt

          assert version("pqfilt") == os.environ["EXPECTED_VERSION"]
          assert Path(pqfilt.__file__).resolve().is_relative_to(
              Path(sysconfig.get_path("purelib")).resolve()
          ), "Tests must import the installed distribution"
          PY
          .artifact-venv/bin/pqfilt --help
          .artifact-venv/bin/python -m pytest tests -q
